<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Keuangan Guang Ji</title>
  <link rel="icon" type="image/png" href="img/logo-emblem.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sheet.css">
  <link rel="stylesheet" href="css/report.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- Ditampilkan sebelum login (halaman masuk / buat Admin pertama / wajib ganti kata sandi) -->
  <main id="authScreen" class="auth-screen" hidden></main>

  <!-- Aplikasi utama: sidebar gelap di kiri, panel kerja terang di kanan -->
  <div id="appShell" class="shell" hidden>
    <aside class="sidebar no-print">
      <a class="brand" href="#/dashboard">
        <img src="img/logo-emblem.png" alt="Logo Guang Ji">
        <span><strong>Guang Ji</strong><small>Sistem Keuangan</small></span>
      </a>

      <nav id="flowNav" class="side-nav" aria-label="Menu">
        <a href="#/dashboard" data-view="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Dashboard</span></a>

        <p class="side-label">Alur kerja</p>
        <a href="#/mutasi" data-view="mutasi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M7 15h3M3 6h18v12H3z"/></svg><span>Mutasi Bank</span><b>1</b></a>
        <a href="#/draf" data-view="draf">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg><span>Draf</span><b>2</b></a>
        <a href="#/tahunan" data-view="tahunan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 10h18M9 10v9M15 10v9"/></svg><span>Laporan per Pos</span><b>3</b></a>
        <a href="#/cek" data-view="cek">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7zM8.5 12l2.5 2.5 4.5-5"/></svg><span>Cek Saldo</span><b>4</b></a>
        <a href="#/laporan" data-view="laporan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg><span>Laporan PDF</span><b>5</b></a>

        <p class="side-label">Lainnya</p>
        <a href="#/riwayat" data-view="riwayat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 7v5l3 2"/></svg><span>Riwayat</span></a>
        <a href="#/pengguna" data-view="pengguna" data-admin data-login-only>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1a4 4 0 0 0-3-3.9M16 4.1a3.5 3.5 0 0 1 0 6.8"/></svg><span>Pengguna</span></a>
        <a href="#/pengaturan" data-view="pengaturan" data-admin>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4m0-11.4-1.4 1.4m-8.6 8.6-1.4 1.4"/></svg><span>Pengaturan</span></a>
      </nav>

      <div class="user-card" id="userMenu"></div>
    </aside>

    <div class="workspace">
      <header class="topbar no-print">
        <div class="topbar-title">
          <strong id="fothangName">—</strong>
          <small>Yayasan Guang Ji</small>
        </div>
        <div class="topbar-controls">
          <label class="pill-select"><span>Fothang</span><select id="fothangSelect" aria-label="Pilih Fothang"></select></label>
          <label class="pill-select"><span>Tahun</span><select id="yearSelect" aria-label="Pilih tahun buku"></select></label>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
